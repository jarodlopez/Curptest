<head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex-grow flex flex-col items-center justify-center p-4"></div>

    <script type="text/babel">
        const { useState } = React;

        // ==========================================
        //        ICONOS SVG (INLINE)
        // ==========================================
        const Icons = {
            ScanFace: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect width="10" height="8" x="7" y="8" rx="1"/><path d="M10 12h4"/></svg>,
            RotateCcw: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Hash: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Cpu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>,
            Server: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>,
            Copy: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            ShieldAlert: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        };

        // ==========================================
        //        MOTOR DE CÁLCULO (LOGIC)
        // ==========================================

        const CATALOGOS = {
            ENTIDADES: [
                { clave: 'AS', nombre: 'Aguascalientes' }, { clave: 'BC', nombre: 'Baja California' },
                { clave: 'BS', nombre: 'Baja California Sur' }, { clave: 'CC', nombre: 'Campeche' },
                { clave: 'CL', nombre: 'Coahuila' }, { clave: 'CM', nombre: 'Colima' },
                { clave: 'CS', nombre: 'Chiapas' }, { clave: 'CH', nombre: 'Chihuahua' },
                { clave: 'DF', nombre: 'Ciudad de México' }, { clave: 'DG', nombre: 'Durango' },
                { clave: 'GT', nombre: 'Guanajuato' }, { clave: 'GR', nombre: 'Guerrero' },
                { clave: 'HG', nombre: 'Hidalgo' }, { clave: 'JC', nombre: 'Jalisco' },
                { clave: 'MC', nombre: 'México' }, { clave: 'MN', nombre: 'Michoacán' },
                { clave: 'MS', nombre: 'Morelos' }, { clave: 'NT', nombre: 'Nayarit' },
                { clave: 'NL', nombre: 'Nuevo León' }, { clave: 'OC', nombre: 'Oaxaca' },
                { clave: 'PL', nombre: 'Puebla' }, { clave: 'QT', nombre: 'Querétaro' },
                { clave: 'QR', nombre: 'Quintana Roo' }, { clave: 'SP', nombre: 'San Luis Potosí' },
                { clave: 'SL', nombre: 'Sinaloa' }, { clave: 'SR', nombre: 'Sonora' },
                { clave: 'TC', nombre: 'Tabasco' }, { clave: 'TS', nombre: 'Tamaulipas' },
                { clave: 'TL', nombre: 'Tlaxcala' }, { clave: 'VZ', nombre: 'Veracruz' },
                { clave: 'YN', nombre: 'Yucatán' }, { clave: 'ZS', nombre: 'Zacatecas' },
                { clave: 'NE', nombre: 'Nacido en el Extranjero' }
            ],
            PALABRAS_INCONVENIENTES: new Set([
                "BACA", "BAKA", "BUEI", "BUEY", "CACA", "CACO", "CAGA", "CAGO", "CAKA", "CAKO",
                "COGE", "COGI", "COJA", "COJE", "COJI", "COJO", "COLA", "CULO", "FALO", "FETO",
                "GETA", "GUEI", "GUEY", "JETA", "JOTO", "KACA", "KACO", "KAGA", "KAGO", "KAKA",
                "KAKO", "KOGE", "KOGI", "KOJA", "KOJE", "KOJI", "KOJO", "KOLA", "KULO", "LILO",
                "LOCA", "LOCO", "LOKA", "LOKO", "MAME", "MAMO", "MEAR", "MEAS", "MEON", "MIAR",
                "MION", "MOCO", "MOKO", "MULA", "MULO", "NACA", "NACO", "PEDA", "PEDO", "PENE",
                "PIPI", "PITO", "POPO", "PUTA", "PUTO", "QULO", "RATA", "ROBA", "ROBE", "ROBO",
                "RUIN", "SENO", "TETA", "VACA", "VAGA", "VAGO", "VAKA", "VUEI", "VUEY", "WEY"
            ]),
            PREPOSICIONES: new Set([
                "DA", "DAS", "DE", "DEL", "DER", "DI", "DIE", "DD", "EL", "LA", "LOS", "LAS", 
                "LE", "LES", "MAC", "MC", "VAN", "VON", "Y"
            ]),
            NOMBRES_COMUNES: new Set(["JOSE", "MARIA", "MA", "MA."])
        };

        const Engine = {
            // CORRECCIÓN CRÍTICA: Normalización
            // 1. Convertimos a Mayúsculas.
            // 2. IMPORTANTE: Reemplazamos Ñ por X ANTES de quitar acentos (NFD).
            //    Si hacemos NFD primero, la Ñ se separa en N + ~ y al quitar diacríticos queda N.
            //    Al hacerlo antes, MUÑOZ -> MUXOZ, conservando la consonante correcta para RENAPO.
            normalize: (text) => {
                if (!text) return "";
                let res = text.toUpperCase().trim();
                
                // Paso 1: Manejo explícito de Ñ para RENAPO
                res = res.replace(/Ñ/g, "X");
                
                // Paso 2: Eliminación de acentos estándar
                res = res.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                
                // Paso 3: Limpieza de caracteres no alfabéticos
                res = res.replace(/[^A-Z\s]/g, "");
                
                return res;
            },

            cleanNameList: (fullName, isGivenName = false) => {
                const words = Engine.normalize(fullName).split(/\s+/).filter(w => !CATALOGOS.PREPOSICIONES.has(w));
                if (isGivenName && words.length > 1) {
                    if (CATALOGOS.NOMBRES_COMUNES.has(words[0])) return words.slice(1);
                }
                return words.length > 0 ? words : ["X"];
            },

            isVowel: (c) => /[AEIOU]/.test(c),
            isConsonant: (c) => /[B-DF-HJ-NP-TV-Z]/.test(c),

            getFirstVowelInternal: (w) => {
                for (let i = 1; i < w.length; i++) if (Engine.isVowel(w[i])) return w[i];
                return "X";
            },

            getFirstConsonantInternal: (w) => {
                for (let i = 1; i < w.length; i++) {
                    if (Engine.isConsonant(w[i])) return w[i];
                }
                return "X";
            },

            generateRoot4: (nombres, paterno, materno) => {
                const pWords = Engine.cleanNameList(paterno);
                const mWords = materno ? Engine.cleanNameList(materno) : ["X"];
                const nWords = Engine.cleanNameList(nombres, true);

                const pApellido = pWords[0];
                const sApellido = mWords[0];
                const nombre = nWords[0];

                let root = (
                    pApellido[0] + 
                    Engine.getFirstVowelInternal(pApellido) + 
                    (sApellido === "X" ? "X" : sApellido[0]) + 
                    nombre[0]
                );

                if (CATALOGOS.PALABRAS_INCONVENIENTES.has(root)) {
                    root = root[0] + "X" + root.substring(2);
                }
                return root;
            },

            calculateCheckDigit: (curp17) => {
                const dictionary = "0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
                let sum = 0;
                for(let i = 0; i < 17; i++) {
                    const val = dictionary.indexOf(curp17[i]);
                    sum += (val === -1 ? 0 : val) * (18 - i);
                }
                const digit = 10 - (sum % 10);
                return digit === 10 ? 0 : digit;
            },

            parseDate: (dateStr) => {
                if (!dateStr) return null;
                const parts = dateStr.trim().split(/[\/\-\.\s]+/);
                let d, m, y;
                if (parts.length !== 3) return null;
                if (parts[0].length === 4) { y = parts[0]; m = parts[1]; d = parts[2]; } 
                else { d = parts[0]; m = parts[1]; y = parts[2]; }
                
                d = d.padStart(2, '0'); m = m.padStart(2, '0');
                if (isNaN(parseInt(y)) || isNaN(parseInt(m)) || isNaN(parseInt(d))) return null;
                if (m < 1 || m > 12 || d < 1 || d > 31 || y.length !== 4) return null;
                return { year: y, month: m, day: d };
            },

            process: (input) => {
                try {
                    const dateObj = Engine.parseDate(input.fechaNacimiento);
                    if (!dateObj) throw new Error("Fecha inválida");
                    const { year, month, day } = dateObj;
                    const yearShort = year.substring(2, 4);

                    // --- GENERAR RAÍZ ---
                    const root4 = Engine.generateRoot4(input.nombres, input.primerApellido, input.segundoApellido);

                    // --- CURP ---
                    const pWords = Engine.cleanNameList(input.primerApellido);
                    const mWords = input.segundoApellido ? Engine.cleanNameList(input.segundoApellido) : ["X"];
                    const nWords = Engine.cleanNameList(input.nombres, true);

                    const cons1 = Engine.getFirstConsonantInternal(pWords[0]);
                    const cons2 = mWords[0] === "X" ? "X" : Engine.getFirstConsonantInternal(mWords[0]);
                    const cons3 = Engine.getFirstConsonantInternal(nWords[0]);
                    const homoclaveSiglo = parseInt(year) < 2000 ? "0" : "A";

                    const curpBase17 = `${root4}${yearShort}${month}${day}${input.sexo}${input.entidad}${cons1}${cons2}${cons3}${homoclaveSiglo}`;
                    const curpDigit = Engine.calculateCheckDigit(curpBase17);
                    const curpCalculada = `${curpBase17}${curpDigit}`;

                    // --- RFC ESTIMADO ---
                    const rfcBase = `${root4}${yearShort}${month}${day}`;
                    const rfcEstimado = `${rfcBase}XXX`;

                    // --- VALIDACIÓN CRUZADA Y SCORE ---
                    let score = 1.0;
                    const flags = ["VALIDACION_ESTIMADA", "HOMOCLAVE_NO_DEDUCIBLE"];
                    let coincideCurp = null;
                    let coincideRfc = null;

                    if (input.curpIngresado) {
                        if (Engine.normalize(input.curpIngresado) === curpCalculada) {
                            coincideCurp = true;
                        } else {
                            coincideCurp = false;
                            score -= 0.4;
                            flags.push("CURP_INCONSISTENTE");
                        }
                    }

                    if (input.rfcIngresado) {
                        const rfcInputNorm = Engine.normalize(input.rfcIngresado);
                        if (rfcInputNorm.substring(0, 10) === rfcBase) {
                            coincideRfc = true;
                        } else {
                            coincideRfc = false;
                            score -= 0.3;
                            flags.push("RFC_INCONSISTENTE");
                        }
                    }

                    if (input.curpIngresado) {
                        const curpDate = Engine.normalize(input.curpIngresado).substring(4, 10);
                        if (curpDate !== `${yearShort}${month}${day}` && !flags.includes("CURP_INCONSISTENTE")) {
                            flags.push("FECHA_CURP_MISMATCH");
                            score -= 0.2;
                        }
                    }

                    return {
                        curp: curpCalculada,
                        rfc: rfcEstimado,
                        score: Math.max(0, parseFloat(score.toFixed(2))),
                        flags,
                        coincideCurp,
                        coincideRfc
                    };

                } catch (e) {
                    return null;
                }
            }
        };

        // ==========================================
        //        COMPONENTES UI
        // ==========================================

        const InputField = ({ label, value, onChange, placeholder, optional, helperText, icon }) => {
            const IconComp = icon ? Icons[icon] : null;
            return (
                <div className="mb-4">
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">
                        {label} {optional && <span className="text-slate-400 font-normal normal-case">(Opcional)</span>}
                    </label>
                    <div className="relative">
                        <input
                            type="text"
                            value={value}
                            onChange={(e) => onChange(e.target.value)}
                            placeholder={placeholder}
                            className={`w-full px-4 py-2 pl-${icon ? '10' : '4'} bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase placeholder:normal-case transition-all text-sm`}
                        />
                        {IconComp && (
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <IconComp />
                            </div>
                        )}
                    </div>
                    {helperText && <p className="text-xs text-slate-400 mt-1">{helperText}</p>}
                </div>
            );
        };

        const Badge = ({ type, text }) => {
            const colors = {
                green: 'bg-green-100 text-green-800 border-green-200',
                red: 'bg-red-100 text-red-800 border-red-200',
                gray: 'bg-slate-100 text-slate-600 border-slate-200',
                blue: 'bg-blue-100 text-blue-800 border-blue-200',
                yellow: 'bg-yellow-100 text-yellow-800 border-yellow-200'
            };
            return (
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase border ${colors[type] || colors.gray}`}>
                    {text}
                </span>
            );
        };

        const App = () => {
            const initialForm = { 
                nombres: "", primerApellido: "", segundoApellido: "", 
                fechaNacimiento: "", sexo: "", entidad: "",
                curpIngresado: "", rfcIngresado: ""
            };
            
            const [formData, setFormData] = useState(initialForm);
            const [result, setResult] = useState(null);
            const [error, setError] = useState("");

            const handleChange = (f, v) => {
                setFormData(p => ({ ...p, [f]: v }));
                setError(""); setResult(null);
            };

            const handleCalculate = () => {
                if (!formData.nombres || !formData.primerApellido || !formData.fechaNacimiento || !formData.sexo || !formData.entidad) {
                    setError("Complete los campos obligatorios marcados (*).");
                    return;
                }
                const res = Engine.process(formData);
                if (res) setResult(res);
                else setError("Error en los datos. Verifique formato de fecha (DD/MM/AAAA).");
            };

            const handleReset = () => {
                setFormData(initialForm);
                setResult(null);
                setError("");
            };

            const copyTo = (text) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            };

            return (
                <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 font-sans">
                    
                    {/* PANEL IZQUIERDO: INPUTS (5 COLUMNAS) */}
                    <div className="lg:col-span-5 bg-white p-6 rounded-xl shadow-lg border border-slate-200 flex flex-col h-fit">
                        <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                    <div className="text-blue-600"><Icons.ScanFace /></div>
                                    Motor de Identidad
                                </h1>
                                <p className="text-xs text-slate-500 mt-1">Cálculo Determinístico & Pre-KYC</p>
                            </div>
                            {result && (
                                <button onClick={handleReset} className="text-xs text-slate-400 hover:text-red-500 underline flex items-center gap-1">
                                    <span className="w-3 h-3 flex items-center"><Icons.RotateCcw /></span> Limpiar
                                </button>
                            )}
                        </div>

                        <div className="space-y-1">
                            <InputField label="Nombre(s) *" icon="User" value={formData.nombres} onChange={(v) => handleChange("nombres", v)} />
                            <div className="grid grid-cols-2 gap-3">
                                <InputField label="Paterno *" value={formData.primerApellido} onChange={(v) => handleChange("primerApellido", v)} />
                                <InputField label="Materno" optional value={formData.segundoApellido} onChange={(v) => handleChange("segundoApellido", v)} />
                            </div>
                            
                            <div className="grid grid-cols-2 gap-3">
                                <InputField label="Fecha Nac. *" icon="Calendar" placeholder="DD/MM/AAAA" value={formData.fechaNacimiento} onChange={(v) => handleChange("fechaNacimiento", v)} />
                                <div className="mb-4">
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Sexo *</label>
                                    <div className="relative">
                                        <select className="w-full px-4 py-2 pl-10 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none" value={formData.sexo} onChange={(e) => handleChange("sexo", e.target.value)}>
                                            <option value="">Seleccionar...</option>
                                            <option value="H">Hombre</option>
                                            <option value="M">Mujer</option>
                                        </select>
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                            <Icons.Users />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mb-6">
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Entidad Federativa *</label>
                                <div className="relative">
                                    <select className="w-full px-4 py-2 pl-10 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none" value={formData.entidad} onChange={(e) => handleChange("entidad", e.target.value)}>
                                        <option value="">Seleccionar entidad...</option>
                                        {CATALOGOS.ENTIDADES.map(e => <option key={e.clave} value={e.clave}>{e.nombre}</option>)}
                                    </select>
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <Icons.MapPin />
                                    </div>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-slate-100">
                                <p className="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">Validación Cruzada (Opcional)</p>
                                <div className="grid grid-cols-1 gap-3">
                                    <InputField label="CURP Existente" icon="FileText" optional placeholder="Para comparar" value={formData.curpIngresado} onChange={(v) => handleChange("curpIngresado", v)} />
                                    <InputField label="RFC Existente" icon="Hash" optional placeholder="Para comparar" value={formData.rfcIngresado} onChange={(v) => handleChange("rfcIngresado", v)} />
                                </div>
                            </div>
                        </div>

                        {error && (
                            <div className="mt-4 p-3 bg-red-50 text-red-700 rounded-md text-xs border border-red-200 flex items-center gap-2 animate-pulse">
                                <span className="w-4 h-4"><Icons.AlertCircle /></span> {error}
                            </div>
                        )}
                        
                        <button 
                            onClick={handleCalculate} 
                            className="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center gap-2 text-sm"
                        >
                            <span className="w-4 h-4"><Icons.Cpu /></span> Ejecutar Motor
                        </button>
                    </div>

                    {/* PANEL DERECHO: RESULTADOS (7 COLUMNAS) */}
                    <div className="lg:col-span-7 flex flex-col gap-4">
                        
                        {/* TARJETA PRINCIPAL */}
                        <div className={`bg-white p-6 rounded-xl shadow-lg border border-slate-200 flex-grow flex flex-col justify-center transition-all duration-500 relative overflow-hidden ${result ? 'opacity-100' : 'opacity-90'}`}>
                            
                            {!result ? (
                                <div className="text-center text-slate-300 py-12">
                                    <div className="w-20 h-20 mx-auto mb-4 opacity-20"><Icons.Server /></div>
                                    <p className="font-medium text-slate-400">Esperando ejecución...</p>
                                    <p className="text-xs mt-2 opacity-60 max-w-xs mx-auto">Ingrese los datos demográficos para calcular las claves de identidad.</p>
                                </div>
                            ) : (
                                <div className="animate-fade-in w-full h-full flex flex-col">
                                    
                                    {/* HEADER RESULTADOS */}
                                    <div className="flex justify-between items-start mb-6 border-b border-slate-100 pb-4">
                                        <div>
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">Score de Consistencia</div>
                                            <div className="text-4xl font-bold text-slate-800 mt-1 flex items-baseline gap-2">
                                                {Math.round(result.score * 100)}%
                                                <span className={`text-sm font-medium px-2 py-0.5 rounded-full ${result.score >= 0.8 ? 'bg-green-100 text-green-700' : result.score >= 0.5 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>
                                                    {result.score >= 0.8 ? 'ALTA' : result.score >= 0.5 ? 'MEDIA' : 'BAJA'}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="flex flex-wrap gap-1 justify-end max-w-[200px]">
                                                {result.flags.map(flag => (
                                                    <Badge key={flag} type={flag.includes('INCONSISTENTE') ? 'red' : 'gray'} text={flag.replace(/_/g, ' ')} />
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* SECCIÓN CURP */}
                                    <div className="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 relative group">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-xs font-bold text-slate-500 uppercase">CURP Calculada</span>
                                            {result.coincideCurp !== null && (
                                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${result.coincideCurp ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                    {result.coincideCurp ? 'COINCIDE' : 'DIFIERE'}
                                                </span>
                                            )}
                                        </div>
                                        <div className="text-2xl sm:text-3xl font-mono font-bold text-slate-800 break-all tracking-widest">
                                            {result.curp.slice(0,16)}<span className="text-blue-600">{result.curp.slice(16)}</span>
                                        </div>
                                        <button onClick={() => copyTo(result.curp)} className="absolute top-4 right-4 text-slate-300 hover:text-blue-600 transition-colors">
                                            <span className="w-4 h-4 block"><Icons.Copy /></span>
                                        </button>
                                    </div>

                                    {/* SECCIÓN RFC */}
                                    <div className="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 border-dashed relative group">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1">
                                                RFC Estimado <span className="w-3 h-3"><Icons.Info /></span>
                                            </span>
                                            {result.coincideRfc !== null && (
                                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${result.coincideRfc ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                    {result.coincideRfc ? 'BASE COINCIDE' : 'BASE DIFIERE'}
                                                </span>
                                            )}
                                        </div>
                                        <div className="text-2xl sm:text-3xl font-mono font-bold text-slate-700 break-all tracking-widest">
                                            {result.rfc.slice(0,10)}<span className="text-slate-400">XXX</span>
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-2">
                                            * Homoclave no deducible algorítmicamente. Se usa "XXX" como placeholder genérico.
                                        </p>
                                        <button onClick={() => copyTo(result.rfc)} className="absolute top-4 right-4 text-slate-300 hover:text-blue-600 transition-colors">
                                            <span className="w-4 h-4 block"><Icons.Copy /></span>
                                        </button>
                                    </div>
                                    
                                </div>
                            )}
                        </div>

                        {/* INFO LEGAL */}
                        <div className="bg-slate-100 p-4 rounded-lg border border-slate-200 text-[10px] text-slate-500 flex gap-3">
                            <span className="w-5 h-5 text-slate-400 flex-shrink-0"><Icons.ShieldAlert /></span>
                            <div>
                                <p className="font-bold mb-1">Aviso de Privacidad y Uso</p>
                                <p className="leading-relaxed text-justify">
                                    Herramienta de estimación determinística para propósitos de pre-validación financiera (Pre-KYC). 
                                    Los resultados son aproximaciones algorítmicas basadas en las reglas de RENAPO y SAT. 
                                    No constituye una consulta a bases de datos gubernamentales ni garantiza la existencia legal de la persona.
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
